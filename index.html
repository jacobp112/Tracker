<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cairn</title>
    <meta name="description" content="Cairn — a local-first study tracker that gives self-study a real memory." />
    <!-- Fonts are self-hosted via Fontsource (imported in src/main.tsx): EB
         Garamond (display) + Figtree (everything else). No CDN, no third-party
         font requests. -->
    <script>
      /* No-FOUC theme resolution: applied before first paint (Doc 3 §2.3). */
      (function () {
        try {
          var saved = localStorage.getItem('studyos-theme');
          var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', saved || sys);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
