<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>Cairn — a memory for self-study</title>
    <meta name="description" content="Cairn gives your AI-tutored studying a retention curve and a review schedule — local-first, no accounts, your data in a file you own." />

    <!-- One meta, no prefers-color-scheme gate. main.ts rewrites its content
         from the live --bg-page inside the same render() that owns the toggle's
         icon and label, so the browser chrome follows the user's chosen theme —
         not just their OS setting. Starts at the light value; render() runs on
         load and corrects it to whatever the pre-paint script resolved. -->
    <meta name="theme-color" content="#ffffeb" />

    <!-- TODO: set the real origin before launch. -->
    <link rel="canonical" href="https://example.com/landing/" />

    <!-- favicon.svg (public/) is the lavender rounded-square 3-stone variant
         from landing/LOGO — capstone dropped, strokes thickened so the stones
         stay open at 16px. apple-touch-icon.png is still to be produced (a
         180×180 PNG; Apple ignores SVG touch icons). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Shared-link preview. og.png = 1200×630, still to be produced. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cairn" />
    <meta property="og:title" content="Cairn — a memory for self-study" />
    <meta property="og:description" content="Your AI can teach you anything. It just can't remember you learned it. Cairn tracks your courses on a real retention curve — local-first, no accounts." />
    <meta property="og:image" content="https://example.com/og.png" />
    <meta property="og:image:alt" content="Cairn's Overview screen: a course-health ring at 82, with topics due for review on a retention curve." />
    <meta property="og:url" content="https://example.com/landing/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      FONT PRELOAD — add once, deliberately, and only for the two faces used
      above the fold (Inter 400/700 latin). Do NOT preload every weight;
      Fontsource's own docs warn it raises initial load time.

      The hrefs must be Vite's hashed output, so they cannot be hardcoded here.
      Emit them from main.ts instead:

        import interLatin from '@fontsource-variable/inter/files/inter-latin-wght-normal.woff2?url';
        const l = document.createElement('link');
        l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2';
        l.crossOrigin = 'anonymous'; l.href = interLatin;
        document.head.appendChild(l);

      Verify the filename against your installed version:
        ls node_modules/@fontsource-variable/inter/files/
    -->

    <script>
      /*
       * Runs blocking, before first paint. Two jobs, both of which must happen
       * here rather than in main.ts.
       *
       * 1. Theme resolution — no FOUC.
       * 2. The .js flag. main.ts is type="module" and therefore deferred, so
       *    setting .js there meant the page painted with .reveal visible, then
       *    snapped to opacity 0, then faded back in: a flash on every load.
       */
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          /*
           * KEY IS SHARED WITH THE APP. Landing (/landing/) and app (/) are the
           * same origin, so this localStorage entry carries the user's theme
           * across the boundary — which is the whole point. Renaming it to
           * 'cairn-theme' must happen in the SAME commit as the app's rename,
           * with both keys read during a migration window, or the theme flips
           * when crossing between the two.
           */
          var saved = localStorage.getItem('studyos-theme');
          var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          root.setAttribute('data-theme', saved || sys);
        } catch (e) {
          root.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- <header> and <footer> sit OUTSIDE <main>: a <header> in <main> is not a

         section is assembled from its own folder at build time by the
         html-includes hook in vite.config.ts. -->

    <main id="main" tabindex="-1">

    </main>
