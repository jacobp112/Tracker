<!doctype html>
<html lang="en" class="js" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Decay curve — preview</title>
<style>
/* ── STUB TOKENS ONLY ────────────────────────────────────────────
   Approximations of your tokens.css so this file opens standalone.
   Do NOT copy this block — the real page reads the real tokens. */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-caption: 13px; --fs-micro: 11px; --fs-title: 32px; --fs-section: 18px;
  --space-1: 2px;  --space-3: 6px;  --space-5: 10px; --space-6: 12px;
  --space-7: 16px; --space-8: 20px; --space-9: 28px; --space-10: 36px;
  --space-13: 88px;
  --radius-pill: 999px; --radius-chip: 6px;
  --dur-draw: 900ms; --dur-standard: 220ms; --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme='light'] {
  --bg-page: #f5f5f7; --surface: #ffffffbf; --surface-sunken: #00000008;
  --ink: #16161a; --ink-secondary: #4a4a52; --ink-muted: #83838f;
  --border: #00000014; --border-strong: #00000024; --accent: #3b6ef5;
}
[data-theme='dark'] {
  --bg-page: #000000; --surface: #ffffff0f; --surface-sunken: #ffffff08;
  --ink: #f2f2f5; --ink-secondary: #b3b3bd; --ink-muted: #7c7c88;
  --border: #ffffff1a; --border-strong: #ffffff2e; --accent: #6b93ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: var(--space-13) 28px; background: var(--bg-page);
  color: var(--ink); font-family: var(--font-sans); line-height: 1.5;
  font-size: 15px;
}
.band { max-width: 1180px; margin: 0 auto; }
.band-title { font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.02em;
  line-height: 1.2; margin: 0; max-width: 30ch; text-wrap: balance; }
.band-lead { font-size: var(--fs-section); color: var(--ink-secondary);
  max-width: 62ch; margin-top: var(--space-6); line-height: 1.55; }
.controls { display: flex; gap: 8px; margin-bottom: 40px; max-width: 1180px;
  margin-inline: auto; }
.controls button { font: inherit; font-size: 13px; font-weight: 600;
  padding: 6px 14px; border-radius: var(--radius-pill); cursor: pointer;
  background: var(--surface); border: 1px solid var(--border-strong); color: var(--ink); }

/* ── THE ACTUAL BLOCK UNDER TEST ─────────────────────────────── */
.decay-curve { max-width: 620px; margin: var(--space-10) 0 0; }
.decay-svg { width: 100%; height: auto; overflow: visible; }
.decay-grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; }
.decay-axis { stroke: var(--border-strong); stroke-width: 1; }
.decay-tick, .decay-endpoint {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1; font-size: 9px; fill: var(--ink-muted);
}
.decay-event-label, .decay-endpoint-cap {
  font-family: var(--font-sans); font-size: 8.5px; font-weight: 600;
  letter-spacing: 0.07em; text-transform: uppercase; fill: var(--ink-muted);
}
.decay-event { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 3 3; }
.decay-seg, .decay-jump {
  fill: none; stroke: var(--accent); stroke-linecap: round;
  stroke-dasharray: 100; stroke-dashoffset: 0;
}
.decay-seg { stroke-width: 2.5; }
.decay-jump { stroke-width: 2; }
.decay-ghost { fill: none; stroke: var(--ink-muted); stroke-width: 2;
  stroke-linecap: round; stroke-dasharray: 4 4; opacity: 0.45; }
.decay-node { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.decay-endpoint.is-tested { fill: var(--accent); font-weight: 700; font-size: 11px; }
.decay-endpoint.is-untested { font-size: 11px; }
.decay-caption { margin: var(--space-5) 0 0; font-size: var(--fs-caption);
  color: var(--ink-muted); max-width: 52ch; }
.decay-caption em { font-style: normal; color: var(--ink-secondary); font-weight: 600; }

.decay-curve { --step: var(--dur-draw); }
.js .decay-curve:not(.is-drawn) .decay-seg,
.js .decay-curve:not(.is-drawn) .decay-jump { stroke-dashoffset: 100; }
.js .decay-curve:not(.is-drawn) .decay-ghost,
.js .decay-curve:not(.is-drawn) .decay-node,
.js .decay-curve:not(.is-drawn) .decay-event,
.js .decay-curve:not(.is-drawn) .decay-event-label,
.js .decay-curve:not(.is-drawn) .decay-endpoint,
.js .decay-curve:not(.is-drawn) .decay-endpoint-cap { opacity: 0; }
.js .decay-curve.is-drawn .decay-seg,
.js .decay-curve.is-drawn .decay-jump {
  stroke-dashoffset: 0; transition: stroke-dashoffset var(--dur-draw) var(--ease);
}
.js .decay-curve.is-drawn .decay-seg-a { transition-delay: 0ms; }
.js .decay-curve.is-drawn .decay-jump  { transition-delay: calc(var(--step) * 0.9); }
.js .decay-curve.is-drawn .decay-seg-b { transition-delay: calc(var(--step) * 1.3); }
.js .decay-curve.is-drawn .decay-node {
  opacity: 1; transition: opacity var(--dur-standard) var(--ease) calc(var(--step) * 1.2); }
.js .decay-curve.is-drawn .decay-event,
.js .decay-curve.is-drawn .decay-event-label {
  opacity: 1; transition: opacity var(--dur-standard) var(--ease) calc(var(--step) * 0.8); }
.js .decay-curve.is-drawn .decay-ghost {
  opacity: 0.45; transition: opacity var(--dur-standard) var(--ease) calc(var(--step) * 2.1); }
.js .decay-curve.is-drawn .decay-endpoint,
.js .decay-curve.is-drawn .decay-endpoint-cap {
  opacity: 1; transition: opacity var(--dur-standard) var(--ease) calc(var(--step) * 2.3); }

@media (prefers-reduced-motion: reduce) {
  .js .decay-curve .decay-seg, .js .decay-curve .decay-jump {
    stroke-dashoffset: 0 !important; transition-delay: 0ms !important; }
  .js .decay-curve .decay-node, .js .decay-curve .decay-event,
  .js .decay-curve .decay-event-label, .js .decay-curve .decay-endpoint,
  .js .decay-curve .decay-endpoint-cap {
    opacity: 1 !important; transition-delay: 0ms !important; }
  .js .decay-curve .decay-ghost { opacity: 0.45 !important; transition-delay: 0ms !important; }
}
@media (max-width: 560px) {
  .decay-endpoint-cap { display: none; }
  .decay-curve { margin-top: var(--space-8); }
}
</style>
</head>
<body>
  <div class="controls">
    <button id="replay" type="button">Replay draw</button>
    <button id="theme" type="button">Toggle theme</button>
    <button id="nojs" type="button">Toggle no-JS state</button>
  </div>

  <section class="band exams" aria-labelledby="exams-title">
    <h2 class="band-title" id="exams-title">Exams don't count more because we say so. They count more because they're evidence.</h2>
    <p class="band-lead">Test events tune each topic's decay rate, so exams outweigh study sessions by evidence — not arbitrary weights.</p>

    <figure class="decay-curve" id="curve" role="img"
      aria-label="A retention curve over 30 days. Retention decays steeply from 100 percent to 42 percent by day 15. A test event on day 15 restores it to 95 percent and flattens the decay: by day 30 the tested topic sits at 74 percent, while the same topic without a test event would have fallen to 19 percent.">
      <svg class="decay-svg" viewBox="0 0 420 188" xmlns="http://www.w3.org/2000/svg">
        <line class="decay-grid" x1="52" y1="24"  x2="330" y2="24"  />
        <line class="decay-grid" x1="52" y1="90"  x2="330" y2="90"  />
        <line class="decay-axis" x1="52" y1="156" x2="330" y2="156" />

        <text class="decay-tick" x="42" y="27"  text-anchor="end">100</text>
        <text class="decay-tick" x="42" y="93"  text-anchor="end">50</text>
        <text class="decay-tick" x="42" y="159" text-anchor="end">0</text>

        <text class="decay-tick" x="52"  y="172" text-anchor="start">day 0</text>
        <text class="decay-tick" x="191" y="172" text-anchor="middle">15</text>
        <text class="decay-tick" x="330" y="172" text-anchor="end">30</text>

        <line class="decay-event" x1="191" y1="24" x2="191" y2="156" />
        <text class="decay-event-label" x="191" y="14" text-anchor="middle">test event</text>

        <path class="decay-seg decay-seg-a" pathLength="100" d="M 52,24 C 76,60 118,86 191,101" />
        <path class="decay-jump" pathLength="100" d="M 191,101 L 191,31" />
        <path class="decay-seg decay-seg-b" pathLength="100" d="M 191,31 C 224,38 275,50 330,58" />
        <path class="decay-ghost" d="M 191,101 C 224,110 275,124 330,131" />

        <circle class="decay-node" cx="191" cy="31" r="3.5" />

        <text class="decay-endpoint is-tested"   x="338" y="55">74%</text>
        <text class="decay-endpoint-cap"         x="338" y="67">tested</text>
        <text class="decay-endpoint is-untested" x="338" y="128">19%</text>
        <text class="decay-endpoint-cap"         x="338" y="140">untested</text>
      </svg>
      <figcaption class="decay-caption">
        Retention (%) over 30 days. A test event resets the curve <em>and</em> flattens what follows.
      </figcaption>
    </figure>
  </section>

<script>
  var curve = document.getElementById('curve');
  var root  = document.documentElement;
  function draw() {
    curve.classList.remove('is-drawn');
    void curve.offsetWidth;               // force reflow so the transition restarts
    requestAnimationFrame(function () { curve.classList.add('is-drawn'); });
  }
  draw();
  document.getElementById('replay').onclick = draw;
  document.getElementById('theme').onclick = function () {
    root.setAttribute('data-theme',
      root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  };
  document.getElementById('nojs').onclick = function () {
    root.classList.toggle('js');
  };
</script>
</body>
</html>
