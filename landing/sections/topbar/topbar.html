<header class="topbar reveal">
      <!-- The header's lockup: compact mark + wordmark, per LOGO/README.md.
           Structure is unchanged because it is a live component — the stone
           FILLS are fixed brand colours baked in here, no shape carries a
           stroke attribute (so the stroke follows currentColor and the mark
           reads correctly as the pill flips), and topbar.css's settle
           animation keys off the .reveal on this header. -->
      <a class="brand" href="/landing/" aria-label="Cairn — home">
        <svg class="brand-mark" viewBox="0 0 100 100" width="24" height="24" aria-hidden="true">
          <rect x="8" y="66" width="84" height="24" rx="12" fill="#ffffeb" stroke-width="4"/>
          <rect x="24" y="38" width="58" height="22" rx="11" fill="#034f46" stroke-width="4"/>
          <rect x="28" y="12" width="38" height="20" rx="10" fill="#f0d7ff" stroke-width="4"/>
          <circle cx="82" cy="14" r="8" fill="#ffa946" stroke-width="4"/>
        </svg>
        <span class="brand-word">Cairn</span>
      </a>

      <nav class="topnav" aria-label="Main">
        <a class="topnav-link" href="#how">How it works</a>
        <a class="topnav-link" href="#privacy">Privacy</a>
        <!-- Hairline between wayfinding and controls: two links that move you
             down the page, then two things that DO something. -->
        <span class="topnav-rule" aria-hidden="true"></span>
        <!-- Icon and label are both painted by topbar.ts. The name is an
             aria-label, not a child element: the icon is installed with
             replaceChildren(), which destroys children, so a label inside the
             button was wiped on first paint and left it nameless. Both are
             rewritten together whenever the theme flips. aria-pressed is gone
             — this control has no pressed state, it names its own outcome. -->
        <button id="theme-toggle" type="button" aria-label="Switch to dark theme"></button>
        <a class="topnav-link" href="/#/auth">Log in</a>
        <a class="btn-primary topbar-cta" href="/#/auth/signup">Sign up</a>
      </nav>
    </header>
